<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Welcome to my first website, built with HTML and published using GitHub Pages.">
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #182230;
      line-height: 1.6;
    }
    header {
      padding: 64px 20px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #155eef, #7f56d9);
    }
    header h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3.2rem); }
    header p { margin: 0; font-size: 1.1rem; }
    main { max-width: 760px; margin: 32px auto; padding: 0 18px; }
    section {
      background: white;
      padding: 24px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(16, 24, 40, 0.07);
    }
    h2 { margin-top: 0; color: #3538cd; }
    footer { text-align: center; padding: 24px; color: #667085; }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Website!</h1>
    <p>My first website, made with HTML and CSS.</p>
  </header>
  <main>
    <section>
      <h2>About This Website</h2>
      <p>Hello! This is a simple static website. I created it as a first step in learning web development.</p>
    </section>
    <section>
      <h2>What I'm Learning</h2>
      <p>HTML, CSS, GitHub, and how to publish websites on the internet.</p>
    </section>
  </main>
  <footer>&copy; 2026 My First Website</footer>
</body>
</html>
