<!DOCTYPE html>
<html>
<head>
<title>My Portfolio - Practical Exam</title>
<style>
  body { font-family: Arial; margin: 0; background: #f2f2f2; color: #333; }
  header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
  nav { background: #34495e; padding: 10px; text-align: center; }
  nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
  .container { padding: 20px; max-width: 800px; margin: auto; background: white; margin-top: 20px; border-radius: 8px; }
  button { background: #2c3e50; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
  input, textarea { width: 95%; padding: 8px; margin: 8px 0; }
  .dark { background: #222 !important; color: white !important; }
  .dark .container { background: #333; color: white; }
  #clock { font-weight: bold; color: yellow; }
</style>
</head>
<body>

<header>
  <h1>My Website</h1>
  <p id="clock">Loading time...</p>
  <button onclick="toggleDark()">Dark / Light Mode</button>
</header>

<nav>
  <a href="#about">About</a>
  <a href="#skills">Skills</a>
  <a href="#contact">Contact</a>
</nav>

<div class="container" id="about">
  <h2>About Me</h2>
  <p>Hello! I am a student. This is my simple static website for practical exam using HTML, CSS and JavaScript.</p>
  <button onclick="sayHello()">Click Me</button>
  <p id="msg"></p>
</div>

<div class="container" id="skills">
  <h2>My Skills</h2>
  <ul>
    <li>HTML - Structure of website</li>
    <li>CSS - Design of website</li>
    <li>JavaScript - Functionality of website</li>
  </ul>
</div>

<div class="container" id="contact">
  <h2>Contact Form</h2>
  <form onsubmit="return validateForm()">
    <input type="text" id="name" placeholder="Enter your Name">
    <input type="text" id="email" placeholder="Enter your Email">
    <textarea id="message" placeholder="Enter Message"></textarea>
    <button type="submit">Submit</button>
  </form>
  <p id="error" style="color:red;"></p>
</div>

<script>
// 1. Live Clock
function updateClock() {
  let now = new Date();
  document.getElementById("clock").innerHTML = "Time: " + now.toLocaleTimeString();
}
setInterval(updateClock, 1000);

// 2. Button Click Event
function sayHello() {
  document.getElementById("msg").innerHTML = "Hello! JavaScript is Working 😊";
}

// 3. Dark Mode Toggle
function toggleDark() {
  document.body.classList.toggle("dark");
}

// 4. Form Validation
function validateForm() {
  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  
  if (name == "" || email == "") {
    document.getElementById("error").innerHTML = "Please fill all fields!";
    return false; // stop form
  }
  if (!email.includes("@")) {
    document.getElementById("error").innerHTML = "Please enter valid email!";
    return false;
  }
  alert("Form Submitted Successfully!");
  return true;
}
</script>

</body>
</html>
